<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>The Split — 5-Day PPL A·B</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Split">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0e1013;--panel:#15191f;--panel-2:#181d24;
  --line:#232a33;--bone:#ece7dd;--dim:#8b94a1;
  --ember:#ff4d2e;--ember-soft:#ff6a3d;--ember-dim:rgba(255,77,46,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--bone);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--ember);color:#0e1013}

/* loading */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;gap:14px}
.ld-ring{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ember);animation:spin .7s linear infinite}
.ld-txt{font-family:'Barlow Condensed';font-size:12px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#1e252f;border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-family:'Barlow Condensed';font-size:13px;letter-spacing:.1em;color:var(--bone);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:98}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* header */
header{padding:24px 20px 14px;border-bottom:1px solid var(--line)}
.kicker{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.32em;font-size:11px;color:var(--ember);text-transform:uppercase}
h1{font-family:'Anton';font-size:clamp(30px,7vw,52px);letter-spacing:.01em;line-height:1;margin-top:6px;text-transform:uppercase}
h1 .thin{color:var(--dim)}
.sub{margin-top:6px;color:var(--dim);font-size:13px;line-height:1.5}

/* sync indicator */
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3c4654;margin-left:8px;vertical-align:middle;transition:background .3s}
.sync-dot.ok{background:#3ecf8e}
.sync-dot.busy{background:var(--ember);animation:pulse 1s ease-in-out infinite}
.sync-dot.err{background:#e05555}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* day tabs */
nav.days{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
nav.days::-webkit-scrollbar{display:none}
.day-tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 14px 9px;cursor:pointer;font-family:'Barlow Condensed';text-align:left;transition:border-color .2s,color .2s,background .2s}
.day-tab .d{display:block;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.day-tab .n{display:block;font-size:17px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--bone);margin-top:1px}
.day-tab.active{background:var(--ember-dim);border-color:var(--ember)}
.day-tab.active .n,.day-tab.active .d{color:var(--ember)}
.day-tab:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* layout */
main{max-width:680px;margin:0 auto}
.session{padding:20px 20px 80px}
.session-head h2{font-family:'Anton';font-size:clamp(24px,4.4vw,38px);text-transform:uppercase;letter-spacing:.015em;line-height:1.05}
.session-head .focus{color:var(--ember)}
.meta{display:flex;gap:12px;margin-top:8px;font-family:'Barlow Condensed';font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;align-items:center;flex-wrap:wrap}
.meta b{color:var(--bone);font-weight:700;margin-right:3px}

/* edit button */
.edit-btn{margin-left:auto;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:none;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.edit-btn:hover{color:var(--ember);border-color:var(--ember)}
.edit-btn.on{background:var(--ember);border-color:var(--ember);color:#0e1013}

/* add panel */
.editor{margin-top:16px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.ed-grid{display:grid;grid-template-columns:1fr 180px;gap:8px}
@media(max-width:480px){.ed-grid{grid-template-columns:1fr}}
.editor input,.editor select{background:var(--bg);border:1px solid var(--line);color:var(--bone);border-radius:9px;padding:11px 12px;font-family:'Inter';font-size:14px;width:100%}
.editor input:focus,.editor select:focus{outline:none;border-color:var(--ember)}
.ed-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ed-actions button{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--bone);transition:color .2s,border-color .2s,background .2s}
.ed-add{background:var(--ember)!important;border-color:var(--ember)!important;color:#0e1013!important}
.ed-add:hover{background:var(--ember-soft)!important}
.ed-reset:hover,.ed-done:hover{color:var(--ember);border-color:var(--ember)}

/* list */
.ex-list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;color:var(--dim);font-size:13px}

/* exercise row — normal */
.ex{display:grid;grid-template-columns:44px 1fr 32px;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid transparent;border-radius:12px;padding:13px 14px 13px 12px;cursor:pointer;text-align:left;width:100%;color:var(--bone);transition:border-color .2s}
.ex:hover{border-color:#36404d}
.ex:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.ex.has-demo{border-left-color:var(--ember)}
.ex.no-demo{cursor:default}
.ex .num{font-family:'Anton';font-size:20px;color:#3c4654;text-align:center;line-height:1}
.ex .info .name{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:18px;letter-spacing:.02em;line-height:1.15}
.ex .info .tag{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.play-dot{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:#3c4654;flex-shrink:0;transition:border-color .2s,color .2s}
.ex.has-demo .play-dot{color:var(--ember);border-color:var(--ember)}
.ex.has-demo:hover .play-dot{background:var(--ember-dim)}

/* edit row */
.ex.editing{grid-template-columns:44px 1fr 32px 32px;cursor:default}
.ex.editing:hover{border-color:var(--line)}

/* upload btn */
.up-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:color .2s,border-color .2s;position:relative;overflow:hidden}
.up-btn:hover{color:var(--ember);border-color:var(--ember)}
.up-btn.has-media{border-color:var(--ember);color:var(--ember)}
.up-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}
.up-btn.loading{pointer-events:none;color:transparent}
.up-btn.loading::after{content:'';position:absolute;inset:4px;border-radius:999px;border:2px solid var(--ember);border-top-color:transparent;animation:spin .7s linear infinite}

/* remove btn */
.rm{width:32px;height:32px;border-radius:999px;background:none;border:1px solid var(--line);color:var(--dim);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:color .2s,border-color .2s}
.rm:hover{color:#e05555;border-color:#e05555}

/* sheet */
.sheet-backdrop{position:fixed;inset:0;z-index:50;background:rgba(6,8,11,.75);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;background:var(--panel-2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:10px 14px calc(24px + env(safe-area-inset-bottom));transform:translateY(104%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
.sheet-backdrop.open .sheet{transform:translateY(0)}
.sheet-grip{width:40px;height:5px;border-radius:999px;background:#39424e;margin:4px auto 14px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-title{font-family:'Barlow Condensed';font-weight:700;font-size:22px;line-height:1.1}
.sheet-tag{display:block;margin-top:3px;font-family:'Barlow Condensed';font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.sheet-btns{display:flex;gap:8px;align-items:center;flex-shrink:0}
.sheet-close,.sheet-del{width:34px;height:34px;border-radius:999px;background:none;border:1px solid var(--line);color:var(--dim);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s}
.sheet-close:hover{color:var(--ember);border-color:var(--ember)}
.sheet-del:hover{color:#e05555;border-color:#e05555}
.sheet-media{background:#111;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:160px}
.sheet-media img{width:100%;max-height:58vh;object-fit:contain;display:block}
.sheet-media video{width:100%;max-height:58vh;display:block}
.sheet-empty{padding:40px;text-align:center;color:#525c6a;font-family:'Barlow Condensed';letter-spacing:.1em;font-size:13px;text-transform:uppercase}

footer{border-top:1px solid var(--line);padding:16px 20px 24px;color:#525c6a;font-size:11.5px;text-align:center}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}.ex{transition:none}.ld-ring{animation:none}}
</style>
</head>
<body>

<div id="loading">
  <div class="ld-ring"></div>
  <div class="ld-txt">Loading your split…</div>
</div>

<div id="toast"></div>

<header>
  <div class="kicker">High-Volume Bodybuilding Program</div>
  <h1>The Split <span class="thin">/ 5-Day PPL A·B</span></h1>
  <p class="sub">
    Tap any exercise with a ▶ to see its demo. In Edit mode, upload your own GIF, image, or video.
    <span class="sync-dot" id="syncDot" title="Sync status"></span>
  </p>
</header>

<nav class="days" id="dayTabs" aria-label="Training days"></nav>

<main>
  <section class="session">
    <div class="session-head">
      <h2 id="dayTitle"></h2>
      <div class="meta">
        <span><b id="exCount"></b>Exercises</span>
        <span><b id="dayTag"></b>Focus</span>
        <span><b id="dayDow"></b></span>
        <button class="edit-btn" id="editBtn" aria-pressed="false">✎ Edit</button>
      </div>
    </div>
    <div class="editor" id="editor" hidden>
      <div class="ed-grid">
        <input id="edName" type="text" placeholder="Exercise name (e.g. Pec Deck Fly)" maxlength="60" autocomplete="off">
        <select id="edMuscle" aria-label="Target muscle"></select>
      </div>
      <div class="ed-actions">
        <button class="ed-add" id="edAdd">＋ Add exercise</button>
        <button class="ed-reset" id="edReset">Reset to default</button>
        <button class="ed-done" id="edDone">Done</button>
      </div>
    </div>
    <div class="ex-list" id="exList" role="list"></div>
  </section>
</main>

<footer>Train hard, recover harder. Built for the 5-day PPL A·B rotation.</footer>

<div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle"></div>
        <span class="sheet-tag" id="sheetTag"></span>
      </div>
      <div class="sheet-btns">
        <button class="sheet-del" id="sheetDel" title="Remove demo" aria-label="Remove demo">🗑</button>
        <button class="sheet-close" id="sheetClose" aria-label="Close">×</button>
      </div>
    </div>
    <div class="sheet-media" id="sheetMedia"></div>
  </div>
</div>

<script>
/* ── CONFIG ─────────────────────────────────────────────────────── */
const SB_URL    = 'https://dlqtrzsrhrvlpwfeqgnv.supabase.co';
const SB_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscXRyenNyaHJ2bHB3ZmVxZ252Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMjQ5MDIsImV4cCI6MjA5NjkwMDkwMn0.UZ9-i2nLSDAm16PFXw0wpLOyS34mMuX_6k5rEVtIWdI';
const BUCKET    = 'exercise-media';
const SB_HEADS  = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

/* ── SUPABASE HELPERS ───────────────────────────────────────────── */
async function sbFetch(path, opts={}){
  const r = await fetch(SB_URL + path, {
    ...opts,
    headers: { ...SB_HEADS, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(!r.ok){ const t=await r.text(); throw new Error(t); }
  return r;
}

/* DB — exercise lists */
async function dbLoadDay(dayId){
  const r = await sbFetch(`/rest/v1/ppl_days?id=eq.${dayId}&select=exercises`, {
    headers:{ 'Accept':'application/json' }
  });
  const rows = await r.json();
  return rows.length ? rows[0].exercises : null;
}
async function dbSaveDay(dayId, exercises){
  await sbFetch('/rest/v1/ppl_days', {
    method:'POST',
    headers:{ 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify({ id: dayId, exercises })
  });
}

/* Storage — media blobs */
function mediaPath(exId, filename){ return `${exId}/${filename}`; }

async function storageUpload(exId, file){
  // delete any existing files for this exercise first
  await storagePurge(exId);
  const ext  = file.name.split('.').pop() || 'bin';
  const path = mediaPath(exId, `demo.${ext}`);
  const r = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method: 'POST',
    headers: { ...SB_HEADS, 'Content-Type': file.type || 'application/octet-stream' },
    body: file
  });
  if(!r.ok){ const t=await r.text(); throw new Error(t); }
  return path;
}
async function storagePurge(exId){
  // list and delete everything under exId/
  try{
    const r = await fetch(`${SB_URL}/storage/v1/object/list/${BUCKET}`, {
      method:'POST',
      headers:{ ...SB_HEADS, 'Content-Type':'application/json' },
      body: JSON.stringify({ prefix: exId+'/' })
    });
    if(!r.ok) return;
    const files = await r.json();
    if(!files.length) return;
    await fetch(`${SB_URL}/storage/v1/object/${BUCKET}`, {
      method:'DELETE',
      headers:{ ...SB_HEADS, 'Content-Type':'application/json' },
      body: JSON.stringify({ prefixes: files.map(f=>`${exId}/${f.name}`) })
    });
  }catch(e){ /* best effort */ }
}
function storagePublicUrl(path){
  return `${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

/* ── DEFAULT DATA ───────────────────────────────────────────────── */
const DEFAULT_DAYS = [
  {id:"pushA",day:"Mon",short:"Push A",title:"Push A",focus:"Chest",exercises:[
    {n:"DB Chest Press",tag:"Mid Chest",m:["midChest"]},
    {n:"Incline Barbell Press",tag:"Upper Chest",m:["upperChest"]},
    {n:"Machine Shoulder Press",tag:"Shoulders",m:["frontDelt","sideDelt"]},
    {n:"Seated Cable Fly",tag:"Mid Chest",m:["midChest"]},
    {n:"Cable Lateral Raise",tag:"Side Delt",m:["sideDelt"]},
    {n:"High-to-Low Cable Fly",tag:"Lower Chest",m:["lowerChest"]},
    {n:"Cable Front Raise (Behind to Forward)",tag:"Front Delt",m:["frontDelt"]},
    {n:"Straight Bar Cable Pushdown",tag:"Triceps",m:["triceps"]},
    {n:"Cable Rope Overhead Extension",tag:"Triceps",m:["triceps"]}
  ]},
  {id:"pullA",day:"Tue",short:"Pull A",title:"Pull A",focus:"Lats & Width",exercises:[
    {n:"Lat Pulldown",tag:"Lats",m:["lats"]},
    {n:"Machine Row",tag:"Upper Back",m:["upperBack"]},
    {n:"Wide Grip Cable Row",tag:"Upper Back",m:["upperBack"]},
    {n:"Cable Lats Pullover",tag:"Lats",m:["lats"]},
    {n:"DB Shrugs",tag:"Traps",m:["traps"]},
    {n:"DB Preacher Curl",tag:"Bicep Short Head",m:["biceps"]},
    {n:"Bayesian Curl",tag:"Bicep Long Head",m:["biceps"]},
    {n:"Rope Hammer Curl",tag:"Brachialis",m:["forearm","biceps"]}
  ]},
  {id:"legs",day:"Wed",short:"Legs",title:"Legs",focus:"Full Lower",exercises:[
    {n:"Squats",tag:"Quads & Glutes",m:["quads","glutes"]},
    {n:"Leg Press",tag:"Quads",m:["quads"]},
    {n:"Stiff Leg Deadlift",tag:"Hamstrings",m:["hams","glutes"]},
    {n:"Hip Thrust",tag:"Glutes",m:["glutes"]},
    {n:"Leg Curl",tag:"Hamstrings",m:["hams"]},
    {n:"Leg Extension",tag:"Quads",m:["quads"]}
  ]},
  {id:"pushB",day:"Thu",short:"Push B",title:"Push B",focus:"Shoulders",exercises:[
    {n:"Seated DB Shoulder Press",tag:"Shoulders",m:["frontDelt","sideDelt"]},
    {n:"Machine Chest Press",tag:"Mid Chest",m:["midChest"]},
    {n:"Supported DB Lateral Raise",tag:"Side Delt",m:["sideDelt"]},
    {n:"Incline Upper Chest Cable Fly",tag:"Upper Chest",m:["upperChest"]},
    {n:"Angled Side Lateral DB Raise",tag:"Side Delt",m:["sideDelt"]},
    {n:"Lower Chest Fly",tag:"Lower Chest",m:["lowerChest"]},
    {n:"Cable Rear Reverse Fly",tag:"Rear Delt",m:["rearDelt"]},
    {n:"Supported EZ Bar Pushdown",tag:"Triceps",m:["triceps"]},
    {n:"Barbell Supported Skull Crusher",tag:"Triceps",m:["triceps"]},
    {n:"Single Arm Cable Pushdown",tag:"Triceps",m:["triceps"]}
  ]},
  {id:"pullB",day:"Fri",short:"Pull B",title:"Pull B",focus:"Thickness & Rows",exercises:[
    {n:"Supported Smith Machine Row",tag:"Upper Back",m:["upperBack"]},
    {n:"Single Arm Seated Pulldown",tag:"Upper Back",m:["upperBack","lats"]},
    {n:"Close Grip Cable Row",tag:"Lower Back",m:["lowerBack","lats"]},
    {n:"Close Grip T-Bar Row",tag:"Mid Back",m:["upperBack","lats"]},
    {n:"Reverse Close Grip Cable Row",tag:"Lower Back",m:["lowerBack","lats"]},
    {n:"Cable Bar Raise From Behind",tag:"Bicep Short Head",m:["biceps"]},
    {n:"Incline DB Curl",tag:"Bicep Long Head",m:["biceps"]},
    {n:"Single Arm Cable Hammer Curl",tag:"Brachialis",m:["forearm","biceps"]}
  ]}
];

const MUSCLES = {
  upperChest:'Upper Chest',midChest:'Mid Chest',lowerChest:'Lower Chest',
  frontDelt:'Front Delt',sideDelt:'Side Delt',rearDelt:'Rear Delt',
  biceps:'Biceps',forearm:'Brachialis / Forearm',triceps:'Triceps',
  traps:'Traps',upperBack:'Upper Back',lats:'Lats',lowerBack:'Lower Back',
  quads:'Quads',hams:'Hamstrings',glutes:'Glutes',calves:'Calves'
};

function makeId(){ return Math.random().toString(36).slice(2,9); }

/* ── STATE ──────────────────────────────────────────────────────── */
let DAYS       = [];          // live exercise data
let mediaMap   = new Map();   // exId -> public URL string
let dayIdx     = 0;
let editMode   = false;
let sheetExId  = null;

/* ── SYNC DOT / TOAST ───────────────────────────────────────────── */
const syncDot = document.getElementById('syncDot');
const toastEl = document.getElementById('toast');
let toastTimer;

function setSyncDot(state){ syncDot.className='sync-dot '+state; }

function toast(msg, dur=2800){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'), dur);
}

/* ── DOM ────────────────────────────────────────────────────────── */
const tabsEl       = document.getElementById('dayTabs');
const listEl       = document.getElementById('exList');
const titleEl      = document.getElementById('dayTitle');
const tagEl        = document.getElementById('dayTag');
const dowEl        = document.getElementById('dayDow');
const countEl      = document.getElementById('exCount');
const backdrop     = document.getElementById('sheetBackdrop');
const sheetMediaEl = document.getElementById('sheetMedia');
const sheetTitleEl = document.getElementById('sheetTitle');
const sheetTagEl   = document.getElementById('sheetTag');

/* ── SHEET ──────────────────────────────────────────────────────── */
function openSheet(ex){
  sheetExId=ex.id;
  sheetTitleEl.textContent=ex.n;
  sheetTagEl.textContent=ex.tag;
  sheetMediaEl.innerHTML='<div class="sheet-empty">Loading…</div>';
  backdrop.classList.add('open');
  backdrop.setAttribute('aria-hidden','false');
  const url=mediaMap.get(ex.id);
  sheetMediaEl.innerHTML='';
  if(!url){ sheetMediaEl.innerHTML='<div class="sheet-empty">No demo added yet</div>'; return; }
  const isVideo=/\.(mp4|mov|webm|avi)(\?|$)/i.test(url);
  if(isVideo){
    const v=document.createElement('video');
    v.src=url; v.controls=true; v.loop=true; v.playsInline=true; v.autoplay=true;
    sheetMediaEl.appendChild(v);
  } else {
    const img=document.createElement('img');
    img.src=url+'?t='+Date.now(); img.alt='Exercise demo'; // cache-bust
    sheetMediaEl.appendChild(img);
  }
}
function closeSheet(){
  backdrop.classList.remove('open');
  backdrop.setAttribute('aria-hidden','true');
  const v=sheetMediaEl.querySelector('video');
  if(v) v.pause();
  setTimeout(()=>sheetMediaEl.innerHTML='',300);
  sheetExId=null;
}

document.getElementById('sheetDel').addEventListener('click', async()=>{
  if(!sheetExId||!confirm('Remove this demo?')) return;
  setSyncDot('busy');
  try{
    await storagePurge(sheetExId);
    mediaMap.delete(sheetExId);
    // remove media_url from exercise record
    const d=DAYS[dayIdx];
    const ex=d.exercises.find(e=>e.id===sheetExId);
    if(ex){ delete ex.media_url; await dbSaveDay(d.id, d.exercises); }
    setSyncDot('ok'); toast('Demo removed');
    closeSheet(); renderList();
  }catch(e){ setSyncDot('err'); toast('Error: '+e.message); }
});
document.getElementById('sheetClose').addEventListener('click',closeSheet);
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

/* ── TABS ───────────────────────────────────────────────────────── */
function buildTabs(){
  tabsEl.innerHTML='';
  DAYS.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='day-tab';
    b.innerHTML=`<span class="d">${d.day}</span><span class="n">${d.short}</span>`;
    b.addEventListener('click',()=>setDay(i));
    tabsEl.appendChild(b);
  });
}

/* ── RENDER ─────────────────────────────────────────────────────── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setDay(i){
  dayIdx=i;
  const d=DAYS[i];
  [...tabsEl.children].forEach((t,k)=>t.classList.toggle('active',k===i));
  const parts=d.title.split(' ');
  titleEl.innerHTML=parts.length>1
    ?`${parts[0]} <span class="focus">${parts.slice(1).join(' ')}</span>`
    :`<span class="focus">${d.title}</span>`;
  tagEl.textContent=d.focus;
  dowEl.textContent=({Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday'})[d.day];
  renderList();
}

function renderList(){
  const d=DAYS[dayIdx];
  countEl.textContent=d.exercises.length;
  listEl.innerHTML='';
  if(!d.exercises.length){
    const el=document.createElement('div');
    el.className='empty'; el.textContent='No exercises. Tap Edit to add one.';
    listEl.appendChild(el); return;
  }
  d.exercises.forEach((ex,k)=>{
    const has=mediaMap.has(ex.id);
    if(editMode){
      const row=document.createElement('div');
      row.className='ex editing';
      row.innerHTML=`
        <span class="num">${String(k+1).padStart(2,'0')}</span>
        <span class="info">
          <span class="name">${esc(ex.n)}</span>
          <span class="tag">${esc(ex.tag)}</span>
        </span>`;

      /* upload */
      const lbl=document.createElement('label');
      lbl.className='up-btn'+(has?' has-media':'');
      lbl.title=has?'Replace demo':'Upload demo';
      lbl.innerHTML=has?'✦':'＋';
      const inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*,video/*,.gif';
      inp.addEventListener('change',async()=>{
        const file=inp.files[0]; if(!file) return;
        lbl.classList.add('loading');
        setSyncDot('busy');
        try{
          const path=await storageUpload(ex.id, file);
          const url=storagePublicUrl(path);
          mediaMap.set(ex.id, url);
          // persist url on the exercise object so we can reload it
          ex.media_url=url;
          await dbSaveDay(DAYS[dayIdx].id, DAYS[dayIdx].exercises);
          setSyncDot('ok'); toast('Demo saved ✓');
          renderList();
        }catch(e){ setSyncDot('err'); toast('Upload failed: '+e.message); lbl.classList.remove('loading'); }
      });
      lbl.appendChild(inp);
      row.appendChild(lbl);

      /* remove */
      const rm=document.createElement('button');
      rm.className='rm'; rm.setAttribute('aria-label','Remove '+ex.n); rm.textContent='×';
      rm.addEventListener('click',async()=>{
        setSyncDot('busy');
        try{
          await storagePurge(ex.id);
          mediaMap.delete(ex.id);
          d.exercises.splice(k,1);
          await dbSaveDay(d.id, d.exercises);
          setSyncDot('ok'); toast('Exercise removed');
          renderList();
        }catch(e){ setSyncDot('err'); toast('Error: '+e.message); }
      });
      row.appendChild(rm);
      listEl.appendChild(row);

    } else {
      const row=document.createElement('button');
      row.setAttribute('role','listitem');
      row.className='ex '+(has?'has-demo':'no-demo');
      row.innerHTML=`
        <span class="num">${String(k+1).padStart(2,'0')}</span>
        <span class="info">
          <span class="name">${esc(ex.n)}</span>
          <span class="tag">${esc(ex.tag)}</span>
        </span>
        <span class="play-dot" aria-hidden="true">${has?'▶':'·'}</span>`;
      if(has) row.addEventListener('click',()=>openSheet(ex));
      listEl.appendChild(row);
    }
  });
}

/* ── EDIT MODE ──────────────────────────────────────────────────── */
const editBtn  = document.getElementById('editBtn');
const editorEl = document.getElementById('editor');
const edName   = document.getElementById('edName');
const edMuscle = document.getElementById('edMuscle');

Object.entries(MUSCLES).forEach(([k,v])=>{
  const o=document.createElement('option'); o.value=k; o.textContent=v; edMuscle.appendChild(o);
});

function enterEditUI(){
  editBtn.classList.toggle('on',editMode);
  editBtn.setAttribute('aria-pressed',String(editMode));
  editBtn.textContent=editMode?'✓ Done':'✎ Edit';
  editorEl.hidden=!editMode;
  renderList();
}
editBtn.addEventListener('click',()=>{ editMode=!editMode; enterEditUI(); if(editMode) edName.focus(); });
document.getElementById('edDone').addEventListener('click',()=>{ editMode=false; enterEditUI(); });
document.getElementById('edReset').addEventListener('click',async()=>{
  if(!confirm('Reset this day to the original program?')) return;
  const d=DAYS[dayIdx];
  setSyncDot('busy');
  try{
    // purge storage for all exercises in this day
    await Promise.all(d.exercises.map(e=>storagePurge(e.id)));
    d.exercises.forEach(e=>mediaMap.delete(e.id));
    // restore defaults
    const def=DEFAULT_DAYS.find(x=>x.id===d.id);
    d.exercises=def.exercises.map(e=>({...e,m:[...e.m],id:makeId()}));
    await dbSaveDay(d.id, d.exercises);
    setSyncDot('ok'); toast('Day reset to default');
    renderList();
  }catch(e){ setSyncDot('err'); toast('Error: '+e.message); }
});

function addExercise(){
  const name=edName.value.trim(); if(!name){ edName.focus(); return; }
  DAYS[dayIdx].exercises.push({n:name,tag:MUSCLES[edMuscle.value],m:[edMuscle.value],id:makeId()});
  setSyncDot('busy');
  dbSaveDay(DAYS[dayIdx].id, DAYS[dayIdx].exercises)
    .then(()=>{ setSyncDot('ok'); })
    .catch(e=>{ setSyncDot('err'); toast('Save failed: '+e.message); });
  edName.value=''; renderList();
}
document.getElementById('edAdd').addEventListener('click',addExercise);
edName.addEventListener('keydown',e=>{ if(e.key==='Enter') addExercise(); });

/* ── BOOT — load all days from Supabase, fall back to defaults ─── */
async function boot(){
  setSyncDot('busy');
  try{
    // load each day; if not in DB yet, use defaults and save them
    const dayData = await Promise.all(
      DEFAULT_DAYS.map(async def=>{
        let exercises = await dbLoadDay(def.id);
        if(!exercises){
          // first run — seed with defaults
          exercises = def.exercises.map(e=>({...e,m:[...e.m],id:makeId()}));
          await dbSaveDay(def.id, exercises);
        }
        return {...def, exercises};
      })
    );
    DAYS = dayData;

    // hydrate mediaMap from media_url stored on each exercise
    DAYS.forEach(d=>d.exercises.forEach(ex=>{
      if(ex.media_url) mediaMap.set(ex.id, ex.media_url);
    }));

    setSyncDot('ok');
  }catch(e){
    setSyncDot('err');
    toast('Could not reach Supabase — check your connection', 4000);
    // fall back to defaults so the UI still works
    DAYS = DEFAULT_DAYS.map(d=>({...d,exercises:d.exercises.map(e=>({...e,m:[...e.m],id:makeId()}))}));
  }

  buildTabs();
  setDay(0);
  document.getElementById('loading').remove();
}

boot();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now(); if(now-lastTouch<350) e.preventDefault(); lastTouch=now;
},{passive:false});
</script>
