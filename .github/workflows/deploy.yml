name: PPL Deploy
on:
  push:
    branches: main
jobs:
  ppl_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        id: checkout
        uses: actions/checkout@v3
        
      - name: Stamp SW version
        shell: bash
        run: sed -i "s/__TIMESTAMP__/$(date +%Y%m%d%H%M%S)/" sw.js
