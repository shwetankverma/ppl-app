name: PPL Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp SW version
        run: sed -i "s/__TIMESTAMP__/$(date +%Y%m%d%H%M%S)/" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # only deploy the app folder, not the whole repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
